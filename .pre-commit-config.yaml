repos:
    -   repo: https://github.com/astral-sh/ruff-pre-commit
        rev: v0.14.14
        hooks:
            -   id: ruff
            -   id: ruff-format
    -   repo: local
        hooks:
            -   id: mypy
                name: mypy
                entry: mypy
                language: system
                types: [python]
                pass_filenames: false
                args: [nerva]
